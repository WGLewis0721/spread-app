name: Native layout acceptance
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/lib/spread/native-v2-*'
      - '.github/workflows/native-layout-acceptance.yml'
      - 'scripts/native-simulator*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-layout-${{ github.ref }}
  # Retain long simulator evidence; the newest revision queues behind the current acceptance run.
  cancel-in-progress: false
jobs:
  viewport:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 390
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-15
          - width: 820
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Air-5th-generation
          - width: 1024
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-6th-generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Create actual compatible simulator
        run: node scripts/native-simulator.mjs ${{ matrix.width }}
      - name: Native viewport screens (${{ matrix.width }} pt)
        run: |
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO -only-testing:SpreadNativeUITests/PlannerUITests/testLayout${{ matrix.width }} -resultBundlePath artifacts/Layout${{ matrix.width }}.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Accessibility audit of every screen and mode, scrolled (${{ matrix.width }} pt)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO -only-testing:SpreadNativeUITests/PlannerUITests/testAudit${{ matrix.width }} -resultBundlePath artifacts/Audit${{ matrix.width }}.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Contrast, Dynamic Type and trait audits (${{ matrix.width }} pt)
        if: ${{ !cancelled() && matrix.width != 1024 }}
        run: |
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO -only-testing:SpreadNativeUITests/PlannerUITests/testAuditExtended${{ matrix.width }} -resultBundlePath artifacts/AuditExtended${{ matrix.width }}.xcresult CODE_SIGNING_ALLOWED=NO
      - name: iPad orientations (${{ matrix.width }} pt)
        if: ${{ !cancelled() && matrix.width != 390 }}
        run: |
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO -only-testing:SpreadNativeUITests/PlannerUITests/testIPadOrientations -resultBundlePath artifacts/Orientations${{ matrix.width }}.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export actual layout screenshots
        if: always()
        run: |
          for bundle in artifacts/*.xcresult; do
            [ -d "$bundle" ] || continue
            name=$(basename "$bundle" .xcresult)
            xcrun xcresulttool export attachments --path "$bundle" --output-path "artifacts/screenshots/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-${{ matrix.width }}
          path: artifacts
