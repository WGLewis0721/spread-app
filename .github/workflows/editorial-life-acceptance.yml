name: Editorial Life art visual acceptance (PR verification)
on:
  pull_request:
    paths:
      - .github/workflows/editorial-life-acceptance.yml

permissions:
  contents: read

jobs:
  actual-native-card-screenshots:
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        width: ["390", "1024"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Prepare simulator at ${{ matrix.width }}pt
        run: node scripts/native-simulator.mjs ${{ matrix.width }}
      - name: Test all six actual SwiftUI artworks, interactions and golden fallback
        run: |
          mkdir -p artifacts
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
            -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 900 \
            -only-testing:SpreadNativeUITests/LifeEditorialPersonalPreviewUITests \
            -resultBundlePath artifacts/LifeArt${{ matrix.width }}.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export native PNG screenshots even after test failures
        if: always()
        run: |
          if [ -d artifacts/LifeArt${{ matrix.width }}.xcresult ]; then
            mkdir -p artifacts/screenshots
            xcrun xcresulttool export attachments --path artifacts/LifeArt${{ matrix.width }}.xcresult --output-path artifacts/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-life-${{ matrix.width }}pt-${{ github.run_id }}
          path: artifacts
