name: Launch video

on:
  pull_request:
    paths: ["tools/launch-video/**", ".github/workflows/launch-video.yml"]
  push:
    branches: [main]
    paths: ["tools/launch-video/**", ".github/workflows/launch-video.yml"]

jobs:
  verify-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/launch-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/launch-video/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/rebuild-audio.py
      - run: npm run check
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-video-smoke
          path: tools/launch-video/out/smoke
