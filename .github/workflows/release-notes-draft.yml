name: Sync customer What's New notes

# After any merge to main, capture only explicit customer-facing notes from its PR.
# This bot updates ReleaseNotes.json on main; no pending notes PR or manual merge.
# GITHUB_TOKEN commits do not trigger another Actions workflow run.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# The script scans all commits since the last published notes marker, so adjacent
# merges are covered even if GitHub replaces a queued run with a newer push.
concurrency:
  group: release-notes-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync customer What's New notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release-note automation
        run: python3 -m unittest discover -s scripts -p test_release_notes_draft.py -v
      - name: Commit customer-facing release notes to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/release_notes_draft.py
