name: Portable SwiftUI contracts

on:
  pull_request:
    paths:
      - "ios/SpreadNativeV2/**"
      - "ios/App/App.xcodeproj/project.pbxproj"
      - "ios/App/App/SceneDelegate.swift"
      - ".github/workflows/spread-v2-native-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift version
        run: swift --version
      - name: Run Crown, hour and presentation unit tests
        run: swift test --package-path ios/SpreadNativeV2
