name: Native editorial Personal preview

# Targeted native screenshots of the editorial Personal card on one iPhone simulator.
# It runs only LifeEditorialPersonalPreviewUITests. It is not the acceptance matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-editorial-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Create iPhone simulator (390 pt class)
        run: node scripts/native-simulator.mjs 390
      - name: Run the targeted Personal card UI test
        run: |
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
            -destination "platform=iOS Simulator,id=$NATIVE_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:SpreadNativeUITests/LifeEditorialPersonalPreviewUITests \
            -resultBundlePath artifacts/preview.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export the attachments and keep the PNG screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path artifacts/preview.xcresult \
            --output-path artifacts/preview-attachments
          python3 - <<'PY'
          import json, os, shutil
          src, dst = "artifacts/preview-attachments", "artifacts/png"
          os.makedirs(dst, exist_ok=True)
          manifest = json.load(open(os.path.join(src, "manifest.json")))
          for test in manifest:
              for att in test.get("attachments", []):
                  readable = att.get("suggestedHumanReadableName", "")
                  exported = att.get("exportedFileName", "")
                  if exported.endswith(".png") and readable.startswith("personal-"):
                      name = readable.split("_")[0]
                      shutil.copy(os.path.join(src, exported), os.path.join(dst, name + ".png"))
          PY
          ls -la artifacts/png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-personal-iphone-screenshots
          path: artifacts/png
          if-no-files-found: error
