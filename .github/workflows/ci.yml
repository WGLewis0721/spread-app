name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:spread
      - run: npm run test:scripts

  bridge-sims:
    # The installed-app logic against a fake native plugin, in Chromium: backup, restore, sync and
    # the shipped (flags off) behavior. This is what makes a broken restore, conflict or link rule fail CI.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install playwright && python3 -m playwright install --with-deps chromium
      - run: sh scripts/ios-bridge-sim/run-all.sh
        env:
          SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bridge-sim-shots
          path: ${{ runner.temp }}/shots

  studio-browser-contrast:
    # Studio remains off in production. Run the actual React planner in Chromium
    # and audit every visible text node against a solid backdrop or worst-case photo.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run dim-zero contrast audit and capture actual Spread/Week
        env:
          VITE_SPREAD_STUDIO: "0"
          STUDIO_AUDIT_ONLY: "1"
        run: |
          npm run dev > /tmp/studio-audit-vite.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types src/spread/components/studio/render.screenshots.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-contrast-evidence
          path: screenshots/studio-g3/
          retention-days: 14

  studio-editor-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture real Customize editor and photo draft
        env:
          VITE_SPREAD_STUDIO: "1"
        run: |
          npm run dev > /tmp/studio-editor-vite.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types src/spread/components/studio/studio-editor.screenshots.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-editor-evidence
          path: screenshots/studio-editor/
          retention-days: 14

  swift-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test SpreadCloudCore (naming, path safety, retention, payload check, sync storage)
        run: swift test --package-path ios/App/SpreadCloudCore

  swift-cloudkit-typecheck:
    # Type-checks the CloudKit code on its own in about a minute, with a hard time limit, so a
    # compiler problem is reported here instead of hanging the long simulator build.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the sync engine
        working-directory: ios/App/App/Cloud
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck
          -target arm64-apple-ios17.0-simulator -swift-version 5
          -Xfrontend -warn-long-expression-type-checking=300
          -Xfrontend -warn-long-function-bodies=600
          SpreadCloudConfig.swift SpreadSyncEngine.swift ../../SpreadCloudCore/Sources/SpreadCloudCore/PayloadCheck.swift ../../SpreadCloudCore/Sources/SpreadCloudCore/SyncStorage.swift ../../SpreadCloudCore/Sources/SpreadCloudCore/OutboxGate.swift
