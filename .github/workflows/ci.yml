name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:spread
      - run: npm run test:scripts
      - name: Check Studio Codemagic dispatcher before activation
        run: python3 -m unittest discover -s scripts -p test_studio_codemagic.py -v
      - name: Verify native CI ownership and Codemagic YAML
        run: |
          ruby -e '
            require "yaml"
            config = YAML.safe_load(File.read("codemagic.yaml"), aliases: true)
            flows = config.fetch("workflows")
            expected = %w[spread-ios-verify spread-release-candidate spread-ios-upload spread-store-status]
            abort "Unexpected Codemagic workflows" unless flows.keys.sort == expected.sort
            abort "Native workflow is not manual" if flows.values.any? { |flow| flow.key?("triggering") }
            verify = flows.fetch("spread-ios-verify")
            abort "Unsafe verifier" if verify.key?("publishing") || verify.key?("integrations") || verify.fetch("environment").key?("ios_signing")
            commands = verify.fetch("scripts").map { |s| s.fetch("script") }.join("\n")
            abort "No immutable source guard" unless commands.include?("git rev-parse HEAD") && commands.include?("git ls-remote")
            abort "No iOS tests" unless commands.include?("xcodebuild test") && commands.include?("LifeUITests")
            upload = flows.fetch("spread-ios-upload").fetch("scripts").map { |s| s.fetch("script") }.join("\n")
            abort "Missing explicit upload approval" unless upload.include?("SPREAD_APPROVED_UPLOAD_SHA")
            puts "Codemagic native ownership verified"
          '

  bridge-sims:
    # The installed-app logic against a fake native plugin, in Chromium: backup, restore, sync and
    # the shipped (flags off) behavior. This is what makes a broken restore, conflict or link rule fail CI.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install playwright && python3 -m playwright install --with-deps chromium
      - run: sh scripts/ios-bridge-sim/run-all.sh
        env:
          SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bridge-sim-shots
          path: ${{ runner.temp }}/shots

  swift-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test SpreadCloudCore (naming, path safety, retention, payload check, sync storage)
        run: swift test --package-path ios/App/SpreadCloudCore
