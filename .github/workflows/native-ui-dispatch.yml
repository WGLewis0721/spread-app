name: Native UI tests (targeted)
on:
  workflow_dispatch:
    inputs:
      width:
        description: "Viewport width in points (390 iPhone 12, 430 iPhone Plus or Pro Max, 820 iPad Air, 1024 iPad Pro)"
        default: "390"
        type: choice
        options: ["390", "430", "820", "1024"]
      tests:
        description: "Space-separated test names: a PlannerUITests method (testLayout390), Class/method (JourneyUITests/testF04_PlaceAndMove) or a whole Class (JourneyUITests)"
        default: "testLayout390"
        type: string
      appearance:
        description: "System appearance applied before the tests"
        default: "light"
        type: choice
        options: ["light", "dark"]
      reduce_motion:
        description: "Set Reduce Motion (1) or leave it off (0). Applied with a simulator reboot."
        default: "0"
        type: choice
        options: ["0", "1"]
permissions:
  contents: read
concurrency:
  group: native-ui-dispatch-${{ github.ref }}-${{ inputs.width }}-${{ inputs.tests }}-${{ inputs.appearance }}-${{ inputs.reduce_motion }}
  cancel-in-progress: false
jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Create actual compatible simulator
        run: node scripts/native-simulator.mjs ${{ inputs.width }}
      - name: Apply appearance and Reduce Motion
        env:
          APPEARANCE: ${{ inputs.appearance }}
          REDUCE_MOTION: ${{ inputs.reduce_motion }}
        run: |
          if [ "$REDUCE_MOTION" = "1" ]; then
            xcrun simctl spawn "$NATIVE_UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
            xcrun simctl shutdown "$NATIVE_UDID"
            xcrun simctl boot "$NATIVE_UDID"
            xcrun simctl bootstatus "$NATIVE_UDID" -b
            xcrun simctl spawn "$NATIVE_UDID" defaults read com.apple.Accessibility ReduceMotionEnabled
          fi
          xcrun simctl ui "$NATIVE_UDID" appearance "$APPEARANCE"
      - name: Run selected actual-app UI tests
        env:
          SELECTED_TESTS: ${{ inputs.tests }}
        run: |
          ONLY=""
          for t in $SELECTED_TESTS; do
            case "$t" in
              (test[A-Za-z0-9_]*) ONLY="$ONLY -only-testing:SpreadNativeUITests/PlannerUITests/$t" ;;
              ([A-Z][A-Za-z0-9]*/test[A-Za-z0-9_]*|[A-Z][A-Za-z0-9]*) ONLY="$ONLY -only-testing:SpreadNativeUITests/$t" ;;
              (*) echo "Rejected test name: $t"; exit 1 ;;
            esac
          done
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
            -destination "platform=iOS Simulator,id=$NATIVE_UDID" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 900 \
            $ONLY -resultBundlePath artifacts/Targeted.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export actual screenshots
        if: always()
        run: |
          if [ -d artifacts/Targeted.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/Targeted.xcresult --output-path artifacts/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ inputs.width }}-${{ github.run_id }}
          path: artifacts
