name: iOS shell

on:
  pull_request:
    paths:
      - "capacitor.config.json"
      - "ios/**"
      - "scripts/export-ios.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "ios/**"
      - "scripts/export-ios.mjs"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-shell:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ios:sync
      - name: Build iPhone simulator app
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath artifacts/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install and launch Spread in iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import subprocess
          import time

          def run(args, timeout=60, check=True):
              return subprocess.run(args, text=True, capture_output=True, check=check, timeout=timeout)

          runtimes = json.loads(run(["xcrun", "simctl", "list", "runtimes", "-j"]).stdout)["runtimes"]
          runtime = next(r["identifier"] for r in reversed(runtimes) if ".iOS-" in r["identifier"] and r.get("isAvailable", True))
          device_types = json.loads(run(["xcrun", "simctl", "list", "devicetypes", "-j"]).stdout)["devicetypes"]
          device_type = next(d["identifier"] for d in device_types if d["name"].startswith("iPhone"))
          udid = run(["xcrun", "simctl", "create", "Spread CI", device_type, runtime]).stdout.strip()
          app = "artifacts/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          os.makedirs("artifacts", exist_ok=True)
          if not os.path.isdir(app):
              raise SystemExit(f"Missing simulator app at {app}")

          try:
              run(["xcrun", "simctl", "boot", udid], timeout=30)
              deadline = time.time() + 120
              while time.time() < deadline:
                  devices = json.loads(run(["xcrun", "simctl", "list", "devices", "-j"], timeout=20).stdout)["devices"]
                  state = next((d["state"] for rows in devices.values() for d in rows if d["udid"] == udid), None)
                  if state == "Booted":
                      break
                  time.sleep(2)
              else:
                  raise TimeoutError("iPhone Simulator did not reach Booted state")

              run(["xcrun", "simctl", "install", udid, app], timeout=60)
              launched = run(["xcrun", "simctl", "launch", udid, "com.graymatter.spread"], timeout=60)
              print(launched.stdout.strip())
              time.sleep(3)
              container = run(["xcrun", "simctl", "get_app_container", udid, "com.graymatter.spread", "app"], timeout=30)
              print("Installed app:", container.stdout.strip())
              run(["xcrun", "simctl", "io", udid, "screenshot", "artifacts/spread-ios.png"], timeout=30)
          finally:
              run(["xcrun", "simctl", "shutdown", udid], timeout=30, check=False)
              run(["xcrun", "simctl", "delete", udid], timeout=30, check=False)
          PY
      - name: Upload simulator smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: spread-ios-smoke
          path: artifacts/spread-ios.png
