name: iOS shell

on:
  pull_request:
    paths:
      - "capacitor.config.json"
      - "ios/**"
      - "scripts/export-ios.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "ios/**"
      - "scripts/export-ios.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  build-ios-shell:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ios:sync
      - name: Build iPhone simulator app
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath artifacts/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install and launch Spread in iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(r["identifier"] for r in reversed(data["runtimes"]) if r["platform"] == "iOS" and r.get("isAvailable", True)))')"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["identifier"] for d in data["devicetypes"] if d["name"].startswith("iPhone")))')"
          UDID="$(xcrun simctl create "Spread CI" "$DEVICE_TYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          python3 - "$UDID" <<'PY'
          import subprocess, sys
          subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=180)
          PY
          APP="artifacts/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.graymatter.spread
          sleep 3
          xcrun simctl get_app_container "$UDID" com.graymatter.spread app
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/spread-ios.png
      - name: Upload simulator smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: spread-ios-smoke
          path: artifacts/spread-ios.png
