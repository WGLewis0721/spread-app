<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Spread SwiftUI native brand specimen: navy canvas, metallic crown, functional blue accent, Chalkboard illustration placeholders and bounded role color cards">
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071020"/><stop offset="1" stop-color="#030814"/></linearGradient>
