appId: com.graymatter.spread
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: out/01-spreads
- scrollUntilVisible:
    element: "New Spread"
    timeout: 20000
- tapOn: "New Spread"
- waitForAnimationToEnd
- tapOn: "Parent, shop, study"
- inputText: "Study"
- hideKeyboard
- tapOn: "Increase Hours for spread 1"
- tapOn: "Increase Hours for spread 1"
- tapOn: "Increase Hours for spread 1"
- takeScreenshot: out/02-new-spread
- tapOn: "Save spreads"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Add a task|What matters most here\?"
    timeout: 20000
- scroll
- scroll
- tapOn:
    text: "What matters most here?"
    below: "Study"
- inputText: "Read chapter 4"
- pressKey: Enter
- inputText: "Practice problem set"
- pressKey: Enter
- inputText: "Review lecture notes"
- pressKey: Enter
- hideKeyboard
- takeScreenshot: out/03-tasks
- scrollUntilVisible:
    element: "Week"
    direction: UP
    timeout: 20000
- tapOn: "Week"
- waitForAnimationToEnd
- takeScreenshot: out/04-week-to-place
- tapOn:
    text: "Study"
    index: 0
- scrollUntilVisible:
    element: "Friday"
    timeout: 20000
- tapOn:
    text: "Add Study"
    below: "Friday"
- scrollUntilVisible:
    element: "Thursday"
- tapOn:
    text: "Add Study"
    below: "Thursday"
- scrollUntilVisible:
    element: "Wednesday"
- tapOn:
    text: "Add Study"
    below: "Wednesday"
- scrollUntilVisible:
    element: "Tuesday"
- tapOn:
    text: "Add Study"
    below: "Tuesday"
- scrollUntilVisible:
    element: "Monday"
- tapOn:
    text: "Add Study"
    below: "Monday"
- waitForAnimationToEnd
- takeScreenshot: out/05-week-spread
