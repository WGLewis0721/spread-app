# Spread native CI: single manual unsigned verification and separately approved upload.
# No automatic native builds, duplicate signed candidates or PR-specific workflows.
workflows:
  spread-ios-verify:
    name: Spread - unsigned native verification (manual)
    # No triggering, signing, Apple integration or publishing. Read-only verification.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: 27.1
      vars:
        VITE_SPREAD_CLOUD_BACKUP: "0"
        VITE_SPREAD_CLOUD_SYNC: "0"
    scripts:
      - name: Pin the reviewed source
        script: |
          set -eu
          test "${CM_PULL_REQUEST:-false}" = false || { echo "Manual only" >&2; exit 1; }
          test "$(printf '%s' "${CM_REPO_SLUG:-}" | tr '[:upper:]' '[:lower:]')" = "wglewis0721/spread-app" || exit 1
          test -n "${CM_BRANCH:-}" && test -n "${CM_COMMIT:-}" || exit 1
          test "$(git rev-parse HEAD)" = "$CM_COMMIT" || exit 1
          CURRENT="$(git ls-remote origin "refs/heads/$CM_BRANCH" | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$CM_COMMIT" || { echo "Branch moved; rerun reviewed tip" >&2; exit 1; }
          test "$VITE_SPREAD_CLOUD_BACKUP" = 0 && test "$VITE_SPREAD_CLOUD_SYNC" = 0
          mkdir -p artifacts/native-verify
          printf '%s\n' "$CM_COMMIT" > artifacts/native-verify/source-sha.txt
          xcodebuild -version | tee artifacts/native-verify/xcode.txt
      - name: Prepare offline simulator app
        script: |
          set -eu
          npm ci
          python3 scripts/app-store-preflight.py
          npm run ios:sync
          python3 scripts/app-store-preflight.py --bundle dist-ios
      - name: Run SwiftUI contracts and Life/Classic simulator journeys
        script: |
          set -eu
          export GITHUB_ENV="$CM_BUILD_DIR/artifacts/native-verify/simulator.env"
          : > "$GITHUB_ENV"
          node scripts/native-simulator.mjs 390
          . "$GITHUB_ENV"
          status=0
          (cd ios/SpreadNativeV2 &&
            xcodebuild test -scheme SpreadNativeV2 \
              -destination "platform=iOS Simulator,id=$NATIVE_UDID" \
              -parallel-testing-enabled NO \
              -resultBundlePath "$CM_BUILD_DIR/artifacts/native-verify/contracts.xcresult" \
              CODE_SIGNING_ALLOWED=NO) || status=$?
          if [ "$status" -eq 0 ]; then
            xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
              -destination "platform=iOS Simulator,id=$NATIVE_UDID" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
              -only-testing:SpreadNativeUITests/LifeUITests/testLifeWeekInboxesAndMonthBrowsingStayInTheActiveLifeExperience \
              -only-testing:SpreadNativeUITests/LifeUITests/testLifeNavigationAndUnmodifiedMoreReachability \
              -only-testing:SpreadNativeUITests/LifeUITests/testCapacityUsesRealStoreAndSurvivesRelaunch \
              -only-testing:SpreadNativeUITests/LifeUITests/testOptOutRestoresClassicWithoutDeletingThePlan \
              -resultBundlePath artifacts/native-verify/life-classic.xcresult \
              CODE_SIGNING_ALLOWED=NO || status=$?
          fi
          for result in artifacts/native-verify/*.xcresult; do
            test -d "$result" || continue
            name="$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments --path "$result" \
              --output-path "artifacts/native-verify/$name-screenshots" || true
          done
          xcrun simctl shutdown "$NATIVE_UDID" || true
          xcrun simctl delete "$NATIVE_UDID" || true
          exit "$status"
      - name: iPad and Duo Life/Classic acceptance
        script: |
          set -eu
          overall=0
          for target in 820 duo; do
            export GITHUB_ENV="$CM_BUILD_DIR/artifacts/native-verify/$target.env"
            : > "$GITHUB_ENV"
            node scripts/native-simulator.mjs "$target"
            . "$GITHUB_ENV"
            test_status=0
            if [ "$target" = duo ]; then
              xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
                -destination "platform=iOS Simulator,id=$NATIVE_UDID" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
                -only-testing:SpreadNativeUITests/DuoUITests \
                -only-testing:SpreadNativeUITests/LifeUITests/testLifeWeekInboxesAndMonthBrowsingStayInTheActiveLifeExperience \
                -resultBundlePath artifacts/native-verify/duo.xcresult \
                CODE_SIGNING_ALLOWED=NO || test_status=$?
            else
              xcodebuild test -project ios/App/App.xcodeproj -scheme SpreadNativeUITests \
                -destination "platform=iOS Simulator,id=$NATIVE_UDID" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
                -only-testing:SpreadNativeUITests/LifeUITests/testLifeNavigationAndUnmodifiedMoreReachability \
                -only-testing:SpreadNativeUITests/LifeUITests/testLifeWeekInboxesAndMonthBrowsingStayInTheActiveLifeExperience \
                -only-testing:SpreadNativeUITests/LifeUITests/testOptOutRestoresClassicWithoutDeletingThePlan \
                -resultBundlePath artifacts/native-verify/ipad.xcresult \
                CODE_SIGNING_ALLOWED=NO || test_status=$?
            fi
            if [ -d "artifacts/native-verify/$target.xcresult" ]; then
              xcrun xcresulttool export attachments \
                --path "artifacts/native-verify/$target.xcresult" \
                --output-path "artifacts/native-verify/$target-screenshots" || true
            fi
            xcrun simctl shutdown "$NATIVE_UDID" || true
            xcrun simctl delete "$NATIVE_UDID" || true
            if [ "$test_status" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
    artifacts:
      - artifacts/native-verify/**
      - /tmp/xcodebuild_logs/*.log

  spread-ios-upload:
    name: Spread - signed iOS upload
    inputs:
      approved_sha:
        description: Full approved 40-character main commit SHA (required for App Store Connect upload)
        type: string
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Spread
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.graymatter.spread
      vars:
        # App Store Connect numeric Apple ID (not the bundle identifier).
        APP_STORE_APPLE_ID: "6821191009"
        SPREAD_APPROVED_UPLOAD_SHA: ${{ inputs.approved_sha }}
        VITE_SPREAD_CLOUD_BACKUP: "0"
        VITE_SPREAD_CLOUD_SYNC: "0"
      node: 22
      xcode: 27.1
    scripts:
      - name: Require main and local-only release settings
        script: |
          set -eu
          test "$CM_BRANCH" = main || { echo "Build must use main" >&2; exit 1; }
          test "${CM_PULL_REQUEST:-false}" = false || { echo "Manual only" >&2; exit 1; }
          test -n "${SPREAD_APPROVED_UPLOAD_SHA:-}" && test "$SPREAD_APPROVED_UPLOAD_SHA" = "$CM_COMMIT" || { echo "Supply reviewed SPREAD_APPROVED_UPLOAD_SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CM_COMMIT" || exit 1
          CURRENT="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$CM_COMMIT" || { echo "main changed; abort upload" >&2; exit 1; }
          test "$VITE_SPREAD_CLOUD_BACKUP" = 0 || exit 1
          test "$VITE_SPREAD_CLOUD_SYNC" = 0 || exit 1
      - name: Install and check the planner
        script: |
          set -eu
          python3 -m unittest discover -s scripts -p test_app_store_preflight.py -v
          python3 scripts/app-store-preflight.py
          npm ci
          npm run typecheck
          npm run lint
          npm run test:spread
          swift test --package-path ios/SpreadNativeV2
          swift test --package-path ios/App/SpreadCloudCore
      - name: Bundle Spread and synchronize the Capacitor app
        script: |
          set -eu
          npm run ios:sync
          python3 scripts/app-store-preflight.py --bundle dist-ios
      - name: Select unused Apple build number and production push entitlement
        script: |
          set -eu
          # BUILD_NUMBER is only a Codemagic workflow counter; it may be behind Apple.
          # This query covers both App Store and TestFlight, across all versions.
          # Fail closed if App Store Connect cannot be queried; never reuse a guessed number.
          LATEST_APPLE_BUILD="$(app-store-connect get-latest-build-number \
            --platform IOS --all-versions "$APP_STORE_APPLE_ID")"
          python3 scripts/ios_build_number.py set \
            --latest-apple "$LATEST_APPLE_BUILD" \
            --codemagic-build "$BUILD_NUMBER" \
            --project ios/App/App.xcodeproj/project.pbxproj \
            --record /tmp/spread-ios-build-version.json
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' ios/App/App/App.entitlements
      - name: Apply App Store distribution signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -eu
          # The CLI failure summary omits Swift diagnostics. Print the underlying logs
          # before exiting, preserving the failed archive status and blocking publication.
          if xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App; then
            :
          else
            ARCHIVE_STATUS=$?
            echo "Archive failed; complete underlying Xcode logs follow." >&2
            if test -d /tmp/xcodebuild_logs; then
              find /tmp/xcodebuild_logs -type f -name '*.log' -exec cat {} +
            else
              echo "No /tmp/xcodebuild_logs directory was produced." >&2
            fi
            exit "$ARCHIVE_STATUS"
          fi
          for ipa in build/ios/ipa/*.ipa; do
            test -f "$ipa" || { echo "No signed IPA found" >&2; exit 1; }
            python3 scripts/app-store-preflight.py --ipa "$ipa"
            # Check the signed artifact and re-query Apple immediately before publishing.
            # A concurrently uploaded higher build must stop this upload, not get a 409.
            LATEST_APPLE_BEFORE_PUBLISH="$(app-store-connect get-latest-build-number \
              --platform IOS --all-versions "$APP_STORE_APPLE_ID")"
            python3 scripts/ios_build_number.py verify \
              --ipa "$ipa" \
              --record /tmp/spread-ios-build-version.json \
              --latest-apple "$LATEST_APPLE_BEFORE_PUBLISH"
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  spread-store-status:
    name: Spread - App Store status (read only)
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Spread
    environment:
      vars:
        APP_STORE_APPLE_ID: "6821191009"
      xcode: 27.1
    scripts:
      - name: Read current Apple versions and uploaded builds
        script: |
          set -eu
          mkdir -p artifacts/store-status
          app-store-connect apps app-store-versions --platform IOS --json "$APP_STORE_APPLE_ID" > artifacts/store-status/versions.json
          app-store-connect apps builds --json "$APP_STORE_APPLE_ID" > artifacts/store-status/builds.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("versions", "builds"):
              data = json.loads(Path(f"artifacts/store-status/{name}.json").read_text())
              rows = data if isinstance(data, list) else data.get("data", [data])
              allowed = ("versionString", "appStoreState", "appVersionState", "version", "processingState", "expired", "uploadedDate", "platform")
              summary = [{"id": row.get("id"), **{key: value for key, value in row.get("attributes", row).items() if key in allowed}} for row in rows]
              Path(f"artifacts/store-status/{name}-summary.json").write_text(json.dumps(summary, indent=2))
              print(name, json.dumps(summary))
          PY
    artifacts:
      - artifacts/store-status/*-summary.json

